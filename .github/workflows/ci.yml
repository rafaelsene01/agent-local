name: CI

# Validation only. This workflow never creates a tag, a release or an artifact —
# publishing lives exclusively in release.yml, behind a manual trigger.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Release scripts unit tests
        run: npm run test:scripts

  rust:
    name: Backend (cargo test)
    # Must match the oldest base system we support. Building on a newer base
    # raises the minimum glibc and breaks the .deb/.AppImage on older machines.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf \
            wget \
            curl
          # protoc is required by lance-encoding (a lancedb dependency).
          # Without it `cargo build` fails with "Could not find `protoc`".
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No --include-ignored on purpose: the 4 #[ignore] tests download the ONNX
      # runtime and an embedding model, which would make CI depend on the network.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The CHANGELOG is generated from commit messages, so malformed messages
      # are a real defect, not a style preference.
      - name: Validate commit messages
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          FAILED=0
          while read -r sha; do
            SUBJECT=$(git log -1 --format=%s "$sha")
            case "$SUBJECT" in
              Merge*) continue ;;
            esac
            if ! printf '%s' "$SUBJECT" | grep -Eq "$PATTERN"; then
              echo "::error::Commit $sha does not follow Conventional Commits: $SUBJECT"
              FAILED=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $FAILED
