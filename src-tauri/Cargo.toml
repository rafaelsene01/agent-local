[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
async-trait = "0.1"
futures-util = "0.3"
zip = "2"
tar = "0.4"
flate2 = "1"
# RAG stack (M5). Versions confirmed on crates.io on 2026-07-25; `dotext` was
# rejected for DOCX because its last release is from 2017.
# `ort-load-dynamic` instead of the default static ONNX Runtime: the prebuilt
# static lib needs the MSVC 2022 STL (`__std_find_trivial_8`), which VS 2019
# Build Tools doesn't provide. The DLL is fetched at runtime, the same pattern
# the embedded llama.cpp runtime already uses.
fastembed = { version = "5", default-features = false, features = [
    "ort-load-dynamic",
    "hf-hub-native-tls",
] }
lancedb = "0.31"
arrow-array = "58"
arrow-schema = "58"
pdf-extract = "0.12"
docx-rs = "0.4"

